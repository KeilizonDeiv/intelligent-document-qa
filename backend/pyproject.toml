[project]
name = "intelligent-document-qa-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Document Intelligence Assistant (RAG over uploaded documents)"
authors = [
    { name = "Keilizon-Deiv D. Leones", email = "keilizonleones14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
